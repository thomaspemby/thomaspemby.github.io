<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Writer | The Chamber Brief</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .admin-container { max-width: 700px; margin: 60px auto; padding: 40px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .admin-form { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .admin-input, .admin-textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 1rem; }
        .admin-textarea { font-family: monospace; resize: vertical; }
        .publish-btn { background-color: #002447; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .publish-btn:hover { background-color: #001224; }
    </style>
</head>
<body style="background-color: #f8fafc;">

    <div class="admin-container">
        <h1 style="font-family: 'Georgia', serif; color: #002447;">Local Article Generator</h1>
        <p style="color: #64748b;">Draft your entry below. Clicking generate will immediately download the correctly formatted HTML file to your computer.</p>

        <form id="local-cms" class="admin-form">
            <div>
                <label style="font-weight:700; font-size:0.85rem; text-transform:uppercase;">Article ID / Filename (e.g., 3)</label>
                <input type="text" id="article-id" class="admin-input" placeholder="3" required>
            </div>
            
            <div>
                <label style="font-weight:700; font-size:0.85rem; text-transform:uppercase;">Article Title</label>
                <input type="text" id="article-title" class="admin-input" placeholder="The Future of Capital Markets" required>
            </div>

            <div>
                <label style="font-weight:700; font-size:0.85rem; text-transform:uppercase;">Category / Tag</label>
                <input type="text" id="article-tag" class="admin-input" placeholder="Economics & Finance" required>
            </div>

            <div>
                <label style="font-weight:700; font-size:0.85rem; text-transform:uppercase;">Body Content</label>
                <textarea id="article-body" class="admin-textarea" rows="10" placeholder="<p>Write your paragraphs here...</p>" required></textarea>
            </div>

            <button type="submit" class="publish-btn">Generate & Download File</button>
        </form>
    </div>

    <script>
        document.getElementById("local-cms").addEventListener("submit", (e) => {
            e.preventDefault();
            
            const id = document.getElementById("article-id").value.trim();
            const title = document.getElementById("article-title").value.trim();
            const tag = document.getElementById("article-tag").value.trim();
            const body = document.getElementById("article-body").value.trim();
            
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString("en-US", options);

            // Wraps your text into the layout structure the blog page expects
            const fileContent = `<span class="post-meta">${today} · ${tag}</span>
<h1 class="full-post-title">${title}</h1>
<hr class="editorial-divider">
<div class="full-post-body">
    ${body}
</div>`;

            // Create a virtual browser download trigger
            const blob = new Blob([fileContent], { type: "text/html" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${id}.html`;
            
            // Fire download
            link.click();
            
            // Clean up memory
            URL.revokeObjectURL(link.href);
        });
    </script>
</body>
</html>
