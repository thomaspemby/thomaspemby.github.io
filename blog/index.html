<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Thomas Pemberton-Marsh</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Thomas Pemberton-Marsh</a>
            
            <input type="checkbox" id="menu-toggle" class="menu-toggle">
            <label for="menu-toggle" class="hamburger">
                <i class="fas fa-bars"></i>
            </label>

            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/about/" class="nav-link">About</a></li>
                <li><a href="/blog/" class="nav-link">Blog</a></li>
                <li><a href="/contact/" class="nav-link">Contact</a></li>
            </ul>
        </div>
    </nav>

    <header class="blog-hero">
        <div class="container">
            <h1>The Chamber Brief</h1>
            <p>Political commentary, economic analysis, and dispatches from Westminster and beyond.</p>
        </div>
    </header>

    <main id="blog-feed" class="container blog-container">
        <div class="blog-grid">
            
            

        </div>
    </main>

    <main id="single-post-view" class="container blog-container" style="display: none;">
        <a href="/blog" class="back-to-feed-btn"><i class="fas fa-arrow-left"></i> Back to All Articles</a>
        <article id="active-post-content" class="full-post">
            </article>
    </main>

    <footer class="main-footer">
        <div class="container footer-content">
            <p>&copy; 2026 Thomas Pemberton-Marsh. All rights reserved.</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/thomas-pemberton-marsh/" target="_blank"><i class="fab fa-linkedin"></i></a>
                <a href="#" target="_blank"><i class="fab fa-x-twitter"></i></a>
            </div>
        </div>
    </footer>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const urlParams = new URLSearchParams(window.location.search);
        const blogId = urlParams.get('blog');

        const feedSection = document.getElementById("blog-feed");
        const gridContainer = document.querySelector(".blog-grid");
        const singleViewSection = document.getElementById("single-post-view");
        const contentContainer = document.getElementById("active-post-content");

        // ROUTE A: Single Article Active (?blog=1)
        if (blogId && /^[0-9]+$/.test(blogId)) {
            // Absolute path fetch ensures it finds /articles/1.html regardless of URL slashes
            fetch(`/articles/${blogId}.html`)
                .then(res => { if (!res.ok) throw new Error(); return res.text(); })
                .then(html => {
                    feedSection.style.display = "none";
                    contentContainer.innerHTML = html;
                    
                    const title = contentContainer.querySelector("h1, .full-post-title");
                    if (title) document.title = `${title.innerText} | Thomas Pemberton-Marsh`;
                    
                    singleViewSection.style.display = "block";
                })
                .catch(() => {
                    feedSection.style.display = "block";
                    singleViewSection.style.display = "none";
                });

        // ROUTE B: Loop Through the Folder Dynamically (Scanning 1.html, 2.html...)
        } else {
            feedSection.style.display = "block";
            singleViewSection.style.display = "none";
            gridContainer.innerHTML = ""; 

            // Scrape the directory listing from Python
            fetch('/articles/')
                .then(res => { if (!res.ok) throw new Error(); return res.text(); })
                .then(directoryHtml => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(directoryHtml, 'text/html');
                    
                    // Filter down to strictly numbered files (1.html, 2.html, etc.)
                    const links = Array.from(doc.querySelectorAll('a'))
                                       .map(a => a.getAttribute('href'))
                                       .filter(href => href && /^\d+\.html$/.test(href));

                    if (links.length === 0) {
                        gridContainer.innerHTML = "<p>No briefings found in the articles folder.</p>";
                        return;
                    }

                    // Map across your numerical files and extract contents
                    const fetchPromises = links.map(href => {
                        const slug = href.replace('.html', ''); // Extract "1", "2"
                        
                        return fetch(`/articles/${href}`)
                            .then(res => res.text())
                            .then(articleHtml => {
                                const artDoc = parser.parseFromString(articleHtml, 'text/html');
                                const title = artDoc.querySelector('h1, .full-post-title')?.innerText || "Untitled Briefing";
                                const meta = artDoc.querySelector('.post-meta')?.innerText || "Analysis";
                                const firstParagraph = artDoc.querySelector('p')?.innerText || "";
                                const excerpt = firstParagraph.length > 160 ? firstParagraph.substring(0, 157) + "..." : firstParagraph;

                                return { slug, title, meta, excerpt };
                            })
                            .catch(() => null);
                    });

                    // Render out the dynamic content loops
                    Promise.all(fetchPromises).then(articles => {
                        // Sort articles numerically so 1 shows before 2
                        articles.sort((a, b) => (a && b) ? parseInt(a.slug) - parseInt(b.slug) : 0);

                        articles.forEach(art => {
                            if (!art) return;
                            const card = document.createElement('article');
                            card.className = 'post-card';
                            card.innerHTML = `
                                <span class="post-meta">${art.meta}</span>
                                <h2>${art.title}</h2>
                                <p class="post-excerpt">${art.excerpt}</p>
                                <a href="/blog/?blog=${art.slug}" class="read-more-btn">Read Article <i class="fas fa-arrow-right"></i></a>
                            `;
                            gridContainer.appendChild(card);
                        });
                    });
                })
                .catch(() => {
                    gridContainer.innerHTML = "<p>Unable to read the articles folder directly.</p>";
                });
        }
    });
</script>

</body>
</html>
